# Acceptance checks for release 1.0.
# Each check encodes a finding from the two independent reviews (ids F.. = second review,
# A.. = first review) so that a later edit cannot silently bring an error back.
# Types:
#   absent  — regex must NOT match the rendered report.html of the case
#   present — regex MUST match the rendered report.html of the case
#   fact    — Python expression over facts.json (name f) must be true
# Global checks (every case and repo-wide) live in run_checks.py.

- {id: F01-P0-01, case: 01, type: present, pattern: 'July 2018', why: 'duty dated from the July 2018 provisional measure'}
- {id: F01-P0-01b, case: 01, type: absent, pattern: '(?i)first (year|imposed)[^.]{0,40}2019(?! as a whole)', why: 'no "duties began in 2019"'}
- {id: F01-P0-01c, case: 01, type: fact, expr: 'abs(f["drop_jul_sep"] + 93.6) < 0.1', why: 'Jul→Sep 2018 collapse computed, not typed'}
- {id: F01-P0-02, case: 01, type: absent, pattern: '(?i)two to six times', why: 'Vietnam range is 1.3–6.6'}
- {id: F01-P0-02b, case: 01, type: fact, expr: 'round(f["vn_lo"],1)==1.3 and round(f["vn_hi"],1)==6.6', why: 'Vietnam mirror range'}
- {id: F01-P0-03, case: 01, type: present, pattern: 'HS 8711 60', why: 'mirror check labelled with its real category'}
- {id: F01-P0-03b, case: 01, type: absent, pattern: '(?i)1\.3 ?m(illion)? (more )?e-bikes', why: 'the 1.3m gap is not "e-bikes"'}
- {id: F01-P0-03c, case: 01, type: fact, expr: 'f["ebike_share24"] < 5', why: 'e-bike share of the category disclosed'}
- {id: F01-P1-01, case: 01, type: present, pattern: 'necessary but not sufficient', why: '60/25 thresholds are necessary for a finding, not for escaping it'}
- {id: F01-P1-02, case: 01, type: absent, pattern: '(?i)follows the exporter', why: 'the duty attaches to the producer'}
- {id: F01-P1-04, case: 01, type: fact, expr: 'f["ratio25"] > 1.15 and f["pooled"] > f["ratio_hi"]', why: 'timing rival tested on 2025'}
- {id: F01-P1-05, case: 01, type: absent, pattern: '412,772', why: 'incomplete Prodcom figure removed'}
- {id: F01-P2-02, case: 01, type: absent, pattern: '(?i)evaded', why: 'amounts "at stake", not "evaded"'}
